version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: ph_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ph_user
      POSTGRES_PASSWORD: ph_senha
      POSTGRES_DB: ph_plataforma
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: ph_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
